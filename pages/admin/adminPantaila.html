<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../img/logotxikia.jpeg">
    <script type="module" src="../../js/admin.js" defer></script>
    <script type="module" src="../../js/logout.js" defer></script>
    <link rel="stylesheet" href="../../css/styles.css">
    <title>INFORMATIKA MINTEGIA</title>
</head>

<body>
    <div class="admin">
        <div class="adminErab avatar">
            A
        </div>
        <div>
            <h2 id="erabIzena" class="adminErab">admin</h2>
            <div class="logout">
                <button type="button" id="atzera" class="adminErab btnPrintzipalak">ATZERA</button>
                <button type="button" id="logout" class="adminErab btnPrintzipalak">SAIOA ITXI</button>
            </div>
        </div>
    </div>
    <div class="formDiv" id="formDiv">
        <div class="adminTitulua">
            <img class="userBerria" src="../../img/user-plus.svg">
            <h2>SORTU ERABILTZAILE BERRIA</h2>
        </div>
        <div>
            <form id="form">
                <div>
                    <p>Erabiltzaile izena</p>
                    <input class="inputsAdmin" type="text" id="erab" name="erab">
                </div>
                <div>
                    <p>Pasahitza</p>
                    <input class="inputsAdmin" type="password" id="pas" name="pas">
                </div>
                <p>Rola</p>
                <select id="rola" name="rola" class="select">
                    <option value="user">USER</option>
                    <option value="admin">ADMIN</option>
                </select>
                <div>
                    <button type="button" id="sortu" class="btnPrintzipalak">SORTU</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
