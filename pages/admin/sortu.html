<!doctype html>
<html lang="eu">

<head>

    <link rel="icon" type="image/x-icon" href="../../img/logotxikia.jpeg">

    <link rel="stylesheet" href="../../css/styles.css" />

    <main>

                    <div class="sortuInput">
                        <label for="deskribapena">Deskribapena</label>

                    </div>
                    <div class="sortuInput">
                        <label for="marka">Marka</label>
                        <input type="text" id="marka" name="marka">
                    </div>
                    <div class="sortuInput">
                        <label for="modeloa">Modeloa</label>
                        <input type="text" id="modeloa" name="modeloa">
                    </div>
                </form>
            </div>

            <div id="elementuIrudia">
                <img src="../../img/logotxikia.jpeg" alt="...">
            </div>

            <div id="elementuBotoiak">
                <button type="button" class="btn-atzera" onclick="history.back()">← Atzera</button>
                <button type="button" id="sortu" class="btnPrintzipalak">
                    SORTU
                </button>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>
